<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>친구 방 초대</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="invite-shell">
      <section class="invite-panel" aria-labelledby="invite-title">
        <p class="eyebrow">친구 방 초대</p>
        <h1 id="invite-title">Cozy Performance Room</h1>
        <p class="summary" id="invite-summary">
          호스트가 연 방에 들어가기 위해 필요한 친구 모드팩을 적용하세요.
        </p>

        <dl class="facts" id="room-facts" aria-label="방 정보">
          <div>
            <dt>Minecraft</dt>
            <dd>Java 1.21.1</dd>
          </div>
          <div>
            <dt>프로필</dt>
            <dd>MVP-0 Performance Room</dd>
          </div>
        </dl>

        <div class="actions" id="invite-actions"></div>

        <p class="notice">
          Microsoft 또는 Minecraft 비밀번호를 요구하지 않습니다. 이 앱은 Minecraft, Mojang, Microsoft의 공식 제품이 아니며 보증 또는 승인을 받지 않았습니다.
        </p>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
